name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim source
        id: src
        shell: bash
        run: |
          set -e
          if [ -f build.gradle ]; then
            DIR="."
          else
            Z="$(ls -t *.zip 2>/dev/null | head -n 1 || true)"
            [ -n "$Z" ] || { echo "Khong co build.gradle va khong co zip"; exit 1; }
            rm -rf proj && mkdir proj
            unzip -q -o "$Z" -d proj
            B="$(find proj -name build.gradle | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)"
            [ -n "$B" ] || { echo "Khong tim thay build.gradle"; exit 1; }
            DIR="$(dirname "$B")"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        shell: bash
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          set +e
          gradle build --no-daemon --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            MSG="$(grep -E -A12 'What went wrong|error:' "$GITHUB_WORKSPACE/build.log" | head -n 30 | tr '\n' '|' | sed 's/|/%0A/g')"
            echo "::error title=LOI THAT::${MSG}"
            echo '### LOI THAT' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E -A12 'What went wrong|error:' "$GITHUB_WORKSPACE/build.log" | head -n 40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $CODE

      - name: Gom jar
        shell: bash
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls "$GITHUB_WORKSPACE/dist"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: dist/*.jar
          if-no-files-found: error
