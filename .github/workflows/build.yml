name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tim source
        id: src
        shell: bash
        run: |
          set -e
          DIR=""
          if [ -f build.gradle ]; then
            DIR="."
          else
            Z="$(ls -t *.zip 2>/dev/null | head -n 1 || true)"
            if [ -z "$Z" ]; then echo "Khong co build.gradle va khong co file zip"; exit 1; fi
            echo "Dung file: $Z"
            rm -rf proj && mkdir proj
            unzip -q -o "$Z" -d proj
            B="$(find proj -name build.gradle -not -path '*/.git/*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)"
            if [ -z "$B" ]; then echo "Khong tim thay build.gradle"; exit 1; fi
            DIR="$(dirname "$B")"
          fi
          echo "Source dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        shell: bash
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Gom jar
        shell: bash
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/dist")" ] || { echo "Khong co jar"; exit 1; }

      - name: Loi (neu co)
        if: failure()
        shell: bash
        run: |
          {
            echo '### Loi build'
            echo '```'
            grep -n -E "error:|FAILED|What went wrong|Could not|symbol:|location:" -A2 build.log | head -150 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: dist/*.jar
          if-no-files-found: error
